syntax = "proto3";

package file_server;
option go_package="./file_server";

// 定义文件存储服务
service FileService {
  // 上传用户头像
  rpc UploadUserAvatar(UploadFileRequest) returns (UploadFileResponse) {}
  rpc GetUserAvatarUrl(GetFileUrlRequest) returns (GetFileUrlResponse) {}
  // 上传活动图标
  rpc UploadActivityIcon(UploadFileRequest) returns (UploadFileResponse) {}
  rpc GetActivityIconUrl(GetFileUrlRequest) returns (GetFileUrlResponse) {}
  // 上传图片(消息)
  rpc UploadImage(UploadFileRequest) returns (UploadFileResponse) {}
  rpc GetImageUrl(GetFileUrlRequest) returns (GetFileUrlResponse) {}
  // 上传文件(消息)
  rpc UploadFile(UploadFileRequest) returns (UploadFileResponse) {}
  rpc GetFileUrl(GetFileUrlRequest) returns (GetFileUrlResponse) {}
}

// 文件上传请求消息结构体
message UploadFileRequest {
  int64 id = 1;
  bytes file_content = 2;
  string file_name = 3;
  string file_type = 4;
}

// 文件上传响应消息结构体，包含返回的文件ID
message UploadFileResponse {
  string file_url = 1;
}

message GetFileUrlRequest {
  int64 id = 1;
}

message GetFileUrlResponse {
  string file_url = 1;
}

// goctl rpc protoc file_server.proto --go_out=./api/v1 --go-grpc_out=./api/v1 --zrpc_out=. --client=true --style=go_zero